apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
spec:
  replicas: 1  # <--- ВАЖНО: Для Block Volume (RWO) реплика должна быть строго одна
  selector:
    matchLabels:
      app: helpdesk-backend
  template:
    metadata:
      labels:
        app: helpdesk-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.repository }}:{{ .Values.backend.tag }}"
          ports:
            - containerPort: {{ .Values.backend.containerPort }}
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:REDACTED_SECRET@{{ .Release.Name }}-db-svc:5432/helpdesk"
          
          # 👇 1. Сюда монтируем диск (внутри контейнера)
          volumeMounts:
            - name: data-storage
              mountPath: /app/uploads   # ⚠️ ВАЖНО: Убедись, что твой Python сохраняет файлы именно сюда!
              
      # 👇 2. Здесь берем диск из Kubernetes
      volumes:
        - name: data-storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-shared-pvc