# Ставим чарт сразу из файла.

- name: Install Kubernetes Dashboard (Direct from GitHub)
  kubernetes.core.helm:
    name: kubernetes-dashboard
    # Прямая ссылка на релиз 7.10.0 (стабильный)
    chart_ref: https://github.com/kubernetes/dashboard/releases/download/kubernetes-dashboard-7.10.0/kubernetes-dashboard-7.10.0.tgz
    release_namespace: kubernetes-dashboard
    create_namespace: true
    values:
      nginx:
        enabled: false
      cert-manager:
        enabled: false
      metrics-server:
        enabled: true
      extraArgs:
        - --enable-insecure-login

# Создаем супер-админа
- name: Create ServiceAccount for Dashboard Admin
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: admin-user
        namespace: kubernetes-dashboard

- name: Create ClusterRoleBinding for Dashboard Admin
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: admin-user
      subjects:
        - kind: ServiceAccount
          name: admin-user
          namespace: kubernetes-dashboard
      roleRef:
        kind: ClusterRole
        name: cluster-admin
        apiGroup: rbac.authorization.k8s.io
