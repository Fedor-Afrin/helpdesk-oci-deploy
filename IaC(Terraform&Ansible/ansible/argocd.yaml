---
# 1. Создаем Namespace
- name: Create ArgoCD Namespace
  kubernetes.core.k8s:
    name: argocd
    kind: Namespace
    state: present

# 2. Устанавливаем сам ArgoCD
- name: Install ArgoCD Manifests
  kubernetes.core.k8s:
    state: present
    src: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
    namespace: argocd
