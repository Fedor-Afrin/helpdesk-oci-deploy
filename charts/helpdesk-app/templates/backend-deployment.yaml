apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
spec:
  # Используем переменную, но помни: для Block Volume в values.yaml должно быть строго 1!
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: helpdesk-backend
  template:
    metadata:
      labels:
        app: helpdesk-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.repository }}:{{ .Values.backend.tag }}"
          ports:
            - containerPort: {{ .Values.backend.containerPort }}
          env:
            - name: DATABASE_URL
              # Твоя исправленная строка подключения:
              value: "postgresql://postgres:REDACTED_SECRET@{{ .Release.Name }}-db-svc:5432/helpdesk"
          
          # 👇 1. Монтируем диск (ИСПРАВИЛ ПУТЬ на /app/media, как в твоем коде!)
          volumeMounts:
            - name: data-storage
              mountPath: /app/media
              
      # 👇 2. Подключаем PVC диск
      volumes:
        - name: data-storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-shared-pvc